name : ci

on: 
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs_on: ubuntu:latest
  
    steps:
    - name: Check out code
      uses: action/checkout@v6
    
    - name: Set up Go
      uses: action/setup-go@v6
      with: go-version: "1.26.0"
    
    - name: Force Failure
      run: (exit 1)